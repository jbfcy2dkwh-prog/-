<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盘口精算 · 手机版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#0b0e14; color:#e8edf5; padding:12px; }
        .app-container { max-width:600px; margin:0 auto; }
        .panel { background:#111821; border-radius:16px; border:1px solid #26323f; padding:16px; margin-bottom:12px; }
        .panel-title { font-size:16px; font-weight:600; color:#d0def0; margin-bottom:12px; border-bottom:1px solid #1f2c3a; padding-bottom:8px; }
        .form-group { margin-bottom:10px; }
        .form-group label { display:block; font-size:13px; color:#9aafc7; margin-bottom:3px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
        .form-control { width:100%; padding:6px 10px; background:#0e141c; border:1px solid #26323f; border-radius:6px; color:#e8edf5; font-size:14px; outline:none; }
        .form-control:focus { border-color:#f0b34b; }
        .btn { padding:8px 16px; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; }
        .btn-primary { background:#f0b34b; color:#0b0e14; width:100%; }
        .btn-success { background:#1a3a2a; color:#6bcfa0; width:100%; margin-top:8px; }
        .history-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #1a222d; cursor:pointer; }
        .history-item .info { flex:1; }
        .history-item .time { font-size:11px; color:#7a8ca3; }
        .history-item .summary { font-size:13px; color:#d0def0; }
        .badge-risk { padding:2px 8px; border-radius:10px; font-size:11px; }
        .badge-risk.low { background:#143a2a; color:#6bcfa0; }
        .badge-risk.medium { background:#3a2a1a; color:#f0b34b; }
        .badge-risk.high { background:#3d1f2a; color:#e8848f; }
        .stat-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px solid #1a222d; }
        .text-muted { color:#4e627a; }
        .core-advice { background:#1a2a2a; border-radius:10px; padding:12px; margin-bottom:10px; border:1px solid #2a4a4a; }
        .core-advice .direction { font-size:20px; font-weight:700; color:#f0b34b; }
        .empty-state { color:#4e627a; text-align:center; padding:20px 0; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; }
        hr { border:0; border-top:1px solid #1f2c3a; margin:12px 0; }
        .disclaimer { font-size:11px; color:#4e627a; border-top:1px solid #1a222d; padding-top:8px; margin-top:8px; }
    </style>
</head>
<body>
<div class="app-container">

    <div class="panel">
        <div class="panel-title">⚽ 盘口精算 · 手机版</div>
        
        <div class="form-group">
            <label>📋 点击加载模拟数据</label>
            <div id="matchList" style="background:#0e141c; border-radius:6px; border:1px solid #26323f; padding:4px; min-height:50px;">
                <div style="color:#4e627a;padding:6px;text-align:center;">加载中...</div>
            </div>
        </div>
        <hr>

        <div class="form-group">
            <label>📝 备注</label>
            <input class="form-control" id="matchNote" placeholder="对阵信息" />
        </div>

        <!-- 欧赔 -->
        <div class="form-group">
            <label>🇪🇺 欧赔 (胜 / 平 / 负)</label>
            <div class="form-row-3">
                <input class="form-control" id="euWinInit" placeholder="初胜" value="1.85" />
                <input class="form-control" id="euDrawInit" placeholder="初平" value="3.60" />
                <input class="form-control" id="euLoseInit" placeholder="初负" value="4.20" />
            </div>
            <div class="form-row-3" style="margin-top:4px;">
                <input class="form-control" id="euWinNow" placeholder="即胜" value="1.80" />
                <input class="form-control" id="euDrawNow" placeholder="即平" value="3.70" />
                <input class="form-control" id="euLoseNow" placeholder="即负" value="4.50" />
            </div>
        </div>

        <!-- 亚盘 -->
        <div class="form-group">
            <label>🌏 亚盘 (让球 / 上盘水位)</label>
            <div class="form-row">
                <select class="form-control" id="asiaHandicapInit">
                    <option value="0.5" selected>半球 (+0.5)</option>
                    <option value="0.75">半一 (+0.75)</option>
                    <option value="1">一球 (+1)</option>
                    <option value="1.25">一球球半</option>
                    <option value="0.25">平半</option>
                    <option value="0">平手</option>
                </select>
                <input class="form-control" id="asiaWaterInit" placeholder="初水" value="0.92" />
            </div>
            <div class="form-row" style="margin-top:4px;">
                <select class="form-control" id="asiaHandicapNow">
                    <option value="0.75" selected>半一 (+0.75)</option>
                    <option value="0.5">半球</option>
                    <option value="1">一球</option>
                </select>
                <input class="form-control" id="asiaWaterNow" placeholder="即水" value="0.88" />
            </div>
        </div>

        <!-- 大小球 -->
        <div class="form-group">
            <label>⚽ 大小球 (盘口 / 大球水位)</label>
            <div class="form-row">
                <select class="form-control" id="ouHandicapInit">
                    <option value="2.5" selected>2.5</option>
                    <option value="2.75">2.75</option>
                    <option value="3">3</option>
                    <option value="2.25">2.25</option>
                </select>
                <input class="form-control" id="ouWaterInit" placeholder="初水" value="0.88" />
            </div>
            <div class="form-row" style="margin-top:4px;">
                <select class="form-control" id="ouHandicapNow">
                    <option value="2.5" selected>2.5</option>
                    <option value="2.75">2.75</option>
                    <option value="3">3</option>
                </select>
                <input class="form-control" id="ouWaterNow" placeholder="即水" value="0.92" />
            </div>
        </div>
        <hr>

        <!-- 近5场 & 交锋 -->
        <div class="form-row">
            <input class="form-control" id="homeGoals" placeholder="主队进球" value="1.8" />
            <input class="form-control" id="homeConceded" placeholder="主队失球" value="1.2" />
        </div>
        <div class="form-row" style="margin-top:4px;">
            <input class="form-control" id="awayGoals" placeholder="客队进球" value="1.5" />
            <input class="form-control" id="awayConceded" placeholder="客队失球" value="0.9" />
        </div>
        <div class="form-row" style="margin-top:4px;">
            <input class="form-control" id="h2hHomeGoals" placeholder="交锋主进球" value="1.2" />
            <input class="form-control" id="h2hAwayGoals" placeholder="交锋客进球" value="0.8" />
        </div>

        <button class="btn btn-primary" id="analyzeBtn" style="margin-top:12px;">🔍 执行分析</button>
        <button class="btn btn-success" id="saveRecordBtn">💾 保存记录</button>
        <div id="saveStatus" style="font-size:12px;color:#6bcfa0;margin-top:4px;text-align:center;"></div>
    </div>

    <div class="panel" id="summaryCard">
        <div class="panel-title">📌 综合研判</div>
        <div id="summaryContent"><div class="empty-state">点击分析或加载数据</div></div>
    </div>

    <div class="panel">
        <div class="flex-between"><span class="panel-title" style="border:0;margin:0;">📜 历史记录</span><span id="historyCount">0条</span></div>
        <div id="historyList"><div class="empty-state">暂无记录</div></div>
    </div>
</div>

<script>
// ============================================================
//  完整算法 + 模拟数据（带调试日志）
// ============================================================
const $ = id => document.getElementById(id);

function toNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function calcProbs(w, d, l) {
    if (w <= 0 || d <= 0 || l <= 0) return { pWin: 0, pDraw: 0, pLose: 0 };
    const total = 1/w + 1/d + 1/l;
    return { pWin: (1/w)/total, pDraw: (1/d)/total, pLose: (1/l)/total };
}
function calcOUProbs(overWater) {
    if (overWater <= 0 || overWater >= 1.90) return { pOver: 0, pUnder: 0 };
    const under = 1.90 - overWater;
    if (under <= 0) return { pOver: 0, pUnder: 0 };
    const total = 1/overWater + 1/under;
    return { pOver: (1/overWater)/total, pUnder: (1/under)/total };
}
function getColdRisk(pWin, pDraw, pLose, asianH, asianW, overProb) {
    let score = 0, reasons = [];
    if (Math.max(pWin,pDraw,pLose) < 0.38) { score++; reasons.push('欧赔分歧大'); }
    if (pWin > 0.42 && asianH <= 0.25) { score++; reasons.push('主胜高但盘口浅'); }
    if (pLose > 0.42 && asianH >= -0.25) { score++; reasons.push('客胜高但未受让'); }
    if (asianW < 0.70 || asianW > 1.10) { score++; reasons.push('水位异常'); }
    if (pDraw > 0.30) { score++; reasons.push('平局概率高'); }
    score = Math.min(score, 4);
    let level = score >= 3 ? '高' : score >= 2 ? '中' : '低';
    return { score, level, reasons };
}

// ----- 模拟数据（明确定义）-----
const MOCK_MATCHES = [
    { id: 'm1', home: '曼联', away: '利物浦', league: '英超', time: '20:30' },
    { id: 'm2', home: '皇马', away: '巴萨', league: '西甲', time: '03:00' },
    { id: 'm3', home: '拜仁', away: '多特', league: '德甲', time: '22:30' },
];

const MOCK_ODDS = {
    'm1': {
        euWinInit:'1.85', euDrawInit:'3.60', euLoseInit:'4.20',
        euWinNow:'1.80', euDrawNow:'3.70', euLoseNow:'4.50',
        asiaHandicapInit:'0.5', asiaWaterInit:'0.92',
        asiaHandicapNow:'0.75', asiaWaterNow:'0.88',
        ouHandicapInit:'2.5', ouWaterInit:'0.88',
        ouHandicapNow:'2.5', ouWaterNow:'0.92',
        homeGoals:'1.8', homeConceded:'1.2', awayGoals:'1.5', awayConceded:'0.9',
        h2hHomeGoals:'1.2', h2hAwayGoals:'0.8',
        note:'曼联 vs 利物浦'
    },
    'm2': {
        euWinInit:'2.10', euDrawInit:'3.20', euLoseInit:'3.50',
        euWinNow:'2.00', euDrawNow:'3.30', euLoseNow:'3.80',
        asiaHandicapInit:'0.25', asiaWaterInit:'0.85',
        asiaHandicapNow:'0.5', asiaWaterNow:'0.90',
        ouHandicapInit:'2.5', ouWaterInit:'0.90',
        ouHandicapNow:'2.75', ouWaterNow:'0.95',
        homeGoals:'2.2', homeConceded:'0.8', awayGoals:'1.8', awayConceded:'1.0',
        h2hHomeGoals:'1.6', h2hAwayGoals:'1.1',
        note:'皇马 vs 巴萨'
    },
    'm3': {
        euWinInit:'1.95', euDrawInit:'3.80', euLoseInit:'3.20',
        euWinNow:'1.90', euDrawNow:'3.90', euLoseNow:'3.40',
        asiaHandicapInit:'0.5', asiaWaterInit:'0.88',
        asiaHandicapNow:'0.75', asiaWaterNow:'0.92',
        ouHandicapInit:'3.0', ouWaterInit:'0.92',
        ouHandicapNow:'3.25', ouWaterNow:'0.96',
        homeGoals:'2.5', homeConceded:'1.1', awayGoals:'1.9', awayConceded:'1.3',
        h2hHomeGoals:'1.9', h2hAwayGoals:'1.4',
        note:'拜仁 vs 多特'
    }
};

// ----- 加载比赛列表（增加错误处理）-----
function loadMatchList() {
    const container = document.getElementById('matchList');
    console.log('loadMatchList 被调用');
    try {
        if (!MOCK_MATCHES || MOCK_MATCHES.length === 0) {
            container.innerHTML = '<div style="color:#e8848f;padding:6px;">暂无比赛数据</div>';
            return;
        }
        container.innerHTML = MOCK_MATCHES.map(m => `
            <div class="history-item" onclick="loadMatchData('${m.id}')">
                <div class="info">
                    <div style="color:#d0def0;">${m.home} vs ${m.away}</div>
                    <div class="time">${m.league} ${m.time}</div>
                </div>
                <span style="color:#f0b34b;">加载</span>
            </div>
        `).join('');
        console.log('比赛列表渲染完成');
    } catch(e) {
        container.innerHTML = '<div style="color:#e8848f;padding:6px;">列表加载错误</div>';
        console.error(e);
    }
}

// ----- 加载比赛数据（完整版）-----
function loadMatchData(id) {
    const d = MOCK_ODDS[id];
    if (!d) { alert('数据不存在'); return; }
    document.getElementById('euWinInit').value = d.euWinInit;
    document.getElementById('euDrawInit').value = d.euDrawInit;
    document.getElementById('euLoseInit').value = d.euLoseInit;
    document.getElementById('euWinNow').value = d.euWinNow;
    document.getElementById('euDrawNow').value = d.euDrawNow;
    document.getElementById('euLoseNow').value = d.euLoseNow;
    document.getElementById('asiaHandicapInit').value = d.asiaHandicapInit;
    document.getElementById('asiaWaterInit').value = d.asiaWaterInit;
    document.getElementById('asiaHandicapNow').value = d.asiaHandicapNow;
    document.getElementById('asiaWaterNow').value = d.asiaWaterNow;
    document.getElementById('ouHandicapInit').value = d.ouHandicapInit;
    document.getElementById('ouWaterInit').value = d.ouWaterInit;
    document.getElementById('ouHandicapNow').value = d.ouHandicapNow;
    document.getElementById('ouWaterNow').value = d.ouWaterNow;
    document.getElementById('homeGoals').value = d.homeGoals;
    document.getElementById('homeConceded').value = d.homeConceded;
    document.getElementById('awayGoals').value = d.awayGoals;
    document.getElementById('awayConceded').value = d.awayConceded;
    document.getElementById('h2hHomeGoals').value = d.h2hHomeGoals;
    document.getElementById('h2hAwayGoals').value = d.h2hAwayGoals;
    document.getElementById('matchNote').value = d.note;
    runAnalysis();
}

// ----- 分析函数（与之前相同）-----
function runAnalysis() {
    const wN = toNum(document.getElementById('euWinNow').value);
    const dN = toNum(document.getElementById('euDrawNow').value);
    const lN = toNum(document.getElementById('euLoseNow').value);
    const hN = toNum(document.getElementById('asiaHandicapNow').value);
    const wN_asia = toNum(document.getElementById('asiaWaterNow').value);
    const ouH_N = toNum(document.getElementById('ouHandicapNow').value);
    const ouW_N = toNum(document.getElementById('ouWaterNow').value);

    if (wN<=0 || dN<=0 || lN<=0 || wN_asia<=0 || ouW_N<=0) {
        document.getElementById('summaryContent').innerHTML = '<div class="empty-state">请填写完整数据</div>';
        return;
    }

    const pN = calcProbs(wN, dN, lN);
    const ouProb = calcOUProbs(ouW_N);
    const cold = getColdRisk(pN.pWin, pN.pDraw, pN.pLose, hN, wN_asia, ouProb.pOver);

    let direction = '方向不明', dirEmoji = '⚖️';
    const maxP = Math.max(pN.pWin, pN.pDraw, pN.pLose);
    if (pN.pWin === maxP && pN.pWin > 0.38) { direction = '主胜'; dirEmoji = '🏠'; }
    else if (pN.pLose === maxP && pN.pLose > 0.38) { direction = '客胜'; dirEmoji = '✈️'; }
    else if (pN.pDraw === maxP && pN.pDraw > 0.34) { direction = '平局'; dirEmoji = '🤝'; }

    let ouDir = '均衡';
    if (ouProb.pOver > 0.55) ouDir = '大球';
    else if (ouProb.pUnder > 0.55) ouDir = '小球';

    let recAsian = '观望';
    if (pN.pWin > 0.42 && hN > 0.25) recAsian = `上盘 (主-${hN})`;
    else if (pN.pLose > 0.42 && hN < -0.25) recAsian = `下盘 (客+${Math.abs(hN)})`;
    else if (pN.pWin > pN.pLose) recAsian = '主队 平手';
    else recAsian = '客队 平手';

    let recOU = '观望';
    if (ouProb.pOver > 0.60) recOU = `大球 (>${ouH_N})`;
    else if (ouProb.pUnder > 0.60) recOU = `小球 (<${ouH_N})`;

    let stars = '★★★☆☆';
    let conflict = '';
    if (pN.pWin > 0.42 && hN < 0.25) conflict = '⚠️ 主胜高但盘口浅，谨慎';
    if (pN.pLose > 0.42 && hN > -0.25) conflict = '⚠️ 客胜高但未受让，谨慎';

    const note = document.getElementById('matchNote').value.trim() || '';

    let html = `
        <div class="core-advice">
            <div class="direction">${dirEmoji} ${direction} (${(maxP*100).toFixed(0)}%)</div>
            <div style="color:#6a9fd8;font-size:16px;font-weight:600;">${recOU}</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:#7a8ca3;">
                <span>📌 ${recAsian}</span>
                <span>⭐ ${stars}</span>
                <span class="badge-risk ${cold.level === '高' ? 'high' : cold.level === '中' ? 'medium' : 'low'}">冷门${cold.level}</span>
            </div>
        </div>
        <div style="font-size:14px;color:#d0def0;line-height:1.6;">
            ${conflict ? `<span style="color:#e8848f;">${conflict}</span><br>` : ''}
            📊 主胜${(pN.pWin*100).toFixed(1)}% | 平${(pN.pDraw*100).toFixed(1)}% | 客胜${(pN.pLose*100).toFixed(1)}%<br>
            ⚽ 大球${(ouProb.pOver*100).toFixed(1)}% | 小球${(ouProb.pUnder*100).toFixed(1)}%<br>
            ${cold.reasons.length > 0 ? `❄️ 冷门触发：${cold.reasons.join('；')}` : ''}
            ${note ? `📝 备注：${note}` : ''}
        </div>
        <div class="disclaimer">仅供参考，不构成准确预测</div>
    `;
    document.getElementById('summaryContent').innerHTML = html;

    window._lastSummary = {
        shortRec: `${direction} | ${recOU}`,
        recDir: recAsian,
        coldLevel: cold.level,
        note: note,
        top3Scores: '2-1, 1-1, 1-0',
        totalGoalsDual: '2球或3球'
    };
}

// 历史记录
function getHistory() { try { return JSON.parse(localStorage.getItem('oddsHistory')) || []; } catch { return []; } }
function saveHistory(rec) {
    let h = getHistory();
    h.unshift({ ...rec, time: Date.now() });
    if (h.length > 30) h = h.slice(0, 30);
    localStorage.setItem('oddsHistory', JSON.stringify(h));
    renderHistory();
}
function deleteHistory(idx) {
    let h = getHistory(); h.splice(idx, 1); localStorage.setItem('oddsHistory', JSON.stringify(h)); renderHistory();
}
function renderHistory() {
    const h = getHistory();
    document.getElementById('historyCount').textContent = h.length + '条';
    if (!h.length) { document.getElementById('historyList').innerHTML = '<div class="empty-state">暂无记录</div>'; return; }
    document.getElementById('historyList').innerHTML = h.map((rec, i) => `
        <div class="history-item" onclick="deleteHistory(${i})">
            <div class="info">
                <div class="time">${new Date(rec.time).toLocaleString()}</div>
                <div class="summary">${rec.shortRec || rec.recDir} ${rec.note ? '📝'+rec.note : ''}</div>
            </div>
            <span class="badge-risk ${rec.coldLevel === '高' ? 'high' : rec.coldLevel === '中' ? 'medium' : 'low'}">${rec.coldLevel}</span>
        </div>
    `).join('');
}

function saveCurrent() {
    if (!window._lastSummary) { document.getElementById('saveStatus').textContent = '请先分析'; return; }
    saveHistory(window._lastSummary);
    document.getElementById('saveStatus').textContent = '✅ 已保存';
    setTimeout(() => document.getElementById('saveStatus').textContent = '', 2000);
}

// 绑定事件
document.getElementById('analyzeBtn').addEventListener('click', runAnalysis);
document.getElementById('saveRecordBtn').addEventListener('click', saveCurrent);
document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', runAnalysis));

// 初始化：加载列表 + 默认加载第一场
console.log('页面加载完成，开始初始化');
loadMatchList();
renderHistory();
setTimeout(() => {
    console.log('尝试加载第一场模拟数据');
    loadMatchData('m1');
}, 200);
</script>
</body>
</html>
