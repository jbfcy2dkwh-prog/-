<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>盘口精算 · 全联赛版（网站版）</title>
  <!-- 样式与原版一致，省略（请见原文件） -->
  <style>
    /* ... 与原版完全一致 ... */
  </style>
</head>
<body>
<div class="app-container">
  <header class="app-header"> <!-- 与原版相同，略 --> </header>
  <div class="main-grid">
    <div class="panel">
      <!-- ===== 新增：比赛列表 ===== -->
      <div class="form-group" id="matchListGroup">
        <label style="font-weight:600;color:#d0def0;">📋 今日比赛（点击加载数据）</label>
        <div id="matchList" style="max-height:150px;overflow-y:auto;background:#0e141c;border-radius:8px;border:1px solid #26323f;padding:4px;">
          <div style="color:#4e627a;padding:8px;text-align:center;">加载中...</div>
        </div>
        <div class="form-hint">点击比赛名称自动填充欧赔/亚盘/大小球数据</div>
      </div>
      <hr class="section-divider" />

      <!-- 原备注、欧赔、亚盘、大小球、近5场、交锋、联赛风格等输入框（与原版完全相同） -->
      <!-- ... 以下全部保留原版输入元素 ... -->
      <!-- 注意：所有 id 必须与原版一致，以便 loadMatch 能正确填充 -->

      <!-- 底部按钮 -->
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="analyzeBtn" style="flex:1;justify-content:center;">🔍 执行分析</button>
        <button class="btn btn-success" id="saveRecordBtn" style="flex:1;justify-content:center;">💾 保存记录</button>
      </div>
      <div id="saveStatus" style="font-size:12px;color:#6bcfa0;margin-top:4px;text-align:center;"></div>
    </div>

    <!-- 右侧输出区域（与原版完全相同） -->
    <div class="right-panel">
      <!-- 三个分析卡片 + 综合研判 + 历史记录 -->
      <!-- 完全保留原版 -->
    </div>
  </div>
</div>

<script>
  // ================================================================
  //  完整脚本（基于原版，新增比赛列表加载）
  // ================================================================

  // 所有原版函数定义（runAnalysis, generateSummary, renderHistory 等）保持不变
  // 新增 loadMatches 和 loadMatch 函数，并在页面加载时调用

  // 在 DOMContentLoaded 中增加：
  window.addEventListener('DOMContentLoaded', function() {
    // 原版加载示例数据（可保留或去掉）
    loadSample();
    // 加载比赛列表
    loadMatches();
  });

  // 新增函数
  async function loadMatches() {
    try {
      const res = await fetch('/api/matches');
      if (!res.ok) throw new Error('网络错误');
      const matches = await res.json();
      const container = document.getElementById('matchList');
      if (!matches || matches.length === 0) {
        container.innerHTML = '<div style="color:#4e627a;padding:8px;">暂无今日比赛</div>';
        return;
      }
      container.innerHTML = matches.map(m => `
        <div class="history-item" onclick="loadMatch('${m.id}')" style="cursor:pointer;border-bottom:1px solid #1a222d;">
          <div style="display:flex;justify-content:space-between;width:100%;">
            <span style="color:#d0def0;">${m.home} vs ${m.away}</span>
            <span style="color:#7a8ca3;font-size:12px;">${m.league} ${m.time}</span>
          </div>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('matchList').innerHTML = '<div style="color:#e8848f;padding:8px;">加载失败，请检查后端服务</div>';
      console.error(e);
    }
  }

  async function loadMatch(matchId) {
    try {
      const res = await fetch(`/api/odds/${matchId}`);
      if (!res.ok) throw new Error('获取赔率失败');
      const data = await res.json();
      // 填充所有字段（id 需与 HTML 完全匹配）
      document.getElementById('euWinInit').value = data.euWinInit || '';
      document.getElementById('euDrawInit').value = data.euDrawInit || '';
      document.getElementById('euLoseInit').value = data.euLoseInit || '';
      document.getElementById('euWinNow').value = data.euWinNow || '';
      document.getElementById('euDrawNow').value = data.euDrawNow || '';
      document.getElementById('euLoseNow').value = data.euLoseNow || '';
      document.getElementById('asiaHandicapInit').value = data.asiaHandicapInit || '0.5';
      document.getElementById('asiaWaterInit').value = data.asiaWaterInit || '';
      document.getElementById('asiaHandicapNow').value = data.asiaHandicapNow || '0.5';
      document.getElementById('asiaWaterNow').value = data.asiaWaterNow || '';
      document.getElementById('ouHandicapInit').value = data.ouHandicapInit || '2.5';
      document.getElementById('ouWaterInit').value = data.ouWaterInit || '';
      document.getElementById('ouHandicapNow').value = data.ouHandicapNow || '2.5';
      document.getElementById('ouWaterNow').value = data.ouWaterNow || '';
      document.getElementById('leagueStyle').value = data.leagueStyle || 'other';
      document.getElementById('homeGoals').value = data.homeGoals || '';
      document.getElementById('homeConceded').value = data.homeConceded || '';
      document.getElementById('awayGoals').value = data.awayGoals || '';
      document.getElementById('awayConceded').value = data.awayConceded || '';
      document.getElementById('h2hHomeGoals').value = data.h2hHomeGoals || '';
      document.getElementById('h2hAwayGoals').value = data.h2hAwayGoals || '';
      document.getElementById('matchNote').value = data.note || '';
      // 触发自动分析
      runAnalysis();
    } catch (e) {
      alert('加载赔率数据失败：' + e.message);
    }
  }

  // 原版所有函数（runAnalysis, getHistory, saveHistory, renderHistory, loadSample, resetAll, etc.）照搬
  // 为节省篇幅，此处省略，但实际部署时请完整包含原版脚本的所有内容。
  // 请参考原文件中的 <script> 部分，将除 DOMContentLoaded 外的所有代码复制到此处。

  // 重要：确保原版的 runAnalysis 等函数仍然有效。
</script>
</body>
</html>
